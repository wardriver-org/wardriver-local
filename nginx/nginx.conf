worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events { worker_connections 2048; multi_accept on; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    server_tokens off;
    client_max_body_size 512m;

    # JSON compresses extremely well. PMTiles is already binary and is not compressed.
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types application/json application/geo+json application/javascript text/css text/plain image/svg+xml;

    proxy_cache_path /var/cache/nginx/wardriver levels=1:2 keys_zone=wardriver_cache:32m max_size=512m inactive=24h use_temp_path=off;

    upstream wardriver_api { server wardriver:8787; keepalive 32; }

    server {
        listen 8787;
        server_name _;

        # Large exports stream instead of being buffered in nginx.
        location /api/export/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_pass http://wardriver_api;
        }

        # Large local imports can take longer than ordinary API requests.
        location = /api/import {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_request_buffering on;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_pass http://wardriver_api;
        }

        # Never cache changing API data unless explicitly handled below.
        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering on;
            proxy_buffers 16 64k;
            proxy_buffer_size 64k;
            proxy_read_timeout 60s;
            proxy_pass http://wardriver_api;
        }

        # The local PMTiles archive is immutable during normal browsing. Preserve
        # byte-range requests and let the browser cache chunks aggressively.
        location = /maps/region.pmtiles {
            root /;
            sendfile on;
            tcp_nopush on;
            add_header Accept-Ranges bytes always;
            add_header Cache-Control "public, max-age=86400" always;
        }

        # Application code changes between local releases. Never let an older
        # dashboard shell survive an upgrade and talk to a newer backend.
        # PMTiles has its own cacheable location above.
        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering on;
            proxy_read_timeout 60s;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            proxy_pass http://wardriver_api;
        }
    }
}
